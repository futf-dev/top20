<script>
// ============================================================
//  JSONBin 雲端帳號系統（固定設定，無需手動輸入）
// ============================================================
const JSONBIN_BASE  = 'https://api.jsonbin.io/v3';
const SESSION_KEY   = 'biz_session';

// ▼▼▼ 固定設定（已寫死，無需再設定）▼▼▼
const FIXED_API_KEY    = '$2a$10$UceQCMPMjkBeRXVIMCCfh.8jWS7aTALkZHzPo9dAqXZF.EHA5c2Pa';
const FIXED_USERS_BIN  = '6a219a23da38895dfe874287';
// pendingBinId 從 users bin 的 _pendingBinId 欄位自動讀取，快取於此
let _pendingBinId = null;

// 自動取得 pendingBinId（首次呼叫時從雲端讀取，之後快取）
async function getPendingBinId() {
    if (_pendingBinId) return _pendingBinId;
    const data = await binRead(FIXED_USERS_BIN, FIXED_API_KEY);
    _pendingBinId = data._pendingBinId;
    if (!_pendingBinId) throw new Error('找不到 Pending Bin，請聯絡管理員');
    return _pendingBinId;
}

// ---- 密碼雜湊 ----
function hashPwd(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = (((h << 5) + h) | 0) ^ str.charCodeAt(i);
    return (h >>> 0).toString(16).padStart(8, '0');
}

// ---- JSONBin API helpers ----
async function binRead(binId, apiKey) {
    const res = await fetch(`${JSONBIN_BASE}/b/${binId}/latest`, {
        headers: { 'X-Master-Key': apiKey }
    });
    if (!res.ok) throw new Error(`讀取失敗 (${res.status})`);
    const j = await res.json();
    return j.record;
}

async function binWrite(binId, apiKey, data) {
    const res = await fetch(`${JSONBIN_BASE}/b/${binId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey },
        body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(`寫入失敗 (${res.status})`);
    return await res.json();
}

async function binCreate(apiKey, name, data) {
    const res = await fetch(`${JSONBIN_BASE}/b`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey, 'X-Bin-Name': name, 'X-Bin-Private': 'true' },
        body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(`建立 Bin 失敗 (${res.status})`);
    const j = await res.json();
    return j.metadata.id;
}

async function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.classList.add('hidden-element');

    if (!username || !password) { errEl.textContent = '請填寫帳號與密碼'; errEl.classList.remove('hidden-element'); return; }

    setBtn('login-btn', true, '驗證中...');
    try {
        const users = await getUsers();
        const user = users.find(u => u.username === username);
        if (!user) { errEl.textContent = '帳號不存在'; errEl.classList.remove('hidden-element'); return; }
        if (!user.active) { errEl.textContent = '帳號尚未啟用或已被停用，請聯絡管理員'; errEl.classList.remove('hidden-element'); return; }
        if (user.password !== hashPwd(password)) { errEl.textContent = '密碼錯誤'; errEl.classList.remove('hidden-element'); return; }

        saveSession({ username: user.username, displayName: user.displayName, role: user.role });
        enterApp(user);
    } catch(e) {
        errEl.textContent = '雲端連線失敗：' + e.message;
        errEl.classList.remove('hidden-element');
    } finally {
        setBtn('login-btn', false, '登入');
    }
}

function extractTransactions(aoa) {
    let headerIdx = -1;
    for (let i = 0; i < Math.min(20, aoa.length); i++) {
        if (!aoa[i]) continue;
        const rowStr = aoa[i].join('');
        if (rowStr.includes('業代碼') && (rowStr.includes('客戶名稱') || rowStr.includes('客戶'))) { headerIdx = i; break; }
    }
    if (headerIdx === -1) return null;
    const headers = aoa[headerIdx].map(h => String(h || '').trim());
    const hasMonthAndAmount = headers.includes('年月') && headers.includes('業績金額');
    const hasValueCol = headers.includes('數值');
    const format = hasMonthAndAmount ? 'flat' : (hasValueCol ? 'pivot' : null);
    if (!format) return null;
    const txs = [];
    for (let i = headerIdx + 1; i < aoa.length; i++) {
        const rowArr = aoa[i]; if (!rowArr || rowArr.length === 0) continue;
        const row = {}; headers.forEach((h, idx) => { row[h] = rowArr[idx]; });
        const rep = String(row['業代碼'] || '').trim() || '未分派';
        const category = String(row['類別'] || '').trim() || '未分類';
        const rawPN = String(row['產品名稱'] || '').trim();
        const rawPS = String(row['產品系列'] || '').trim();
        let product = rawPN || rawPS || '未知產品';
        const hospital = String(row['客戶名稱'] || row['客戶'] || '').trim();
        if (!hospital) continue;
        const s = (rawPN + ' ' + rawPS).toUpperCase();
        if (s.includes('LOTE')) product = 'Lote FC';
        else if (s.includes('UBIXA 5') || s.includes('EXPREXA 5') || s.includes('XPREXA 5')) product = 'Xprexa 5mg';
        else if (s.includes('UBIXA 10') || s.includes('EXPREXA 10') || s.includes('XPREXA 10')) product = 'Xprexa 10mg';
        if (format === 'pivot') {
            if (!row['數值'] || !String(row['數值']).includes('業績金額')) continue;
            headers.forEach(key => {
                if (key && String(key).match(/^202[56]\d{2}$/)) {
                    const val = parseFloat(String(row[key] || '').replace(/,/g, '')) || 0;
                    if (val !== 0) txs.push({ rep, category, product, hospital, month: String(key), amount: val });
                }
            });
        } else {
            const val = parseFloat(String(row['業績金額'] || '').replace(/,/g, '')) || 0;
            if (val !== 0) txs.push({ rep, category, product, hospital, month: String(row['年月']), amount: val });
        }
    }
    return txs;
}

document.getElementById('file-upload').addEventListener('change', function(e) {
    const file = e.target.files[0]; if (!file) return;
    const btnText = document.getElementById('upload-btn-text');
    btnText.textContent = '處理中...'; showError('');
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'csv') {
        const reader = new FileReader();
        reader.onload = (e) => { Papa.parse(e.target.result, { header: false, skipEmptyLines: true, complete: (r) => { const txs = extractTransactions(r.data); if (txs && txs.length > 0) initializeData(txs); else showError('無法從 CSV 識別業績資料。'); btnText.textContent = '載入出貨明細'; }, error: (e) => { showError('CSV 解析失敗：' + e.message); btnText.textContent = '載入出貨明細'; } }); };
        reader.readAsText(file);
    } else if (ext === 'xlsx' || ext === 'xls') {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                let found = null;
                [...wb.SheetNames].sort((a,b) => { if(a.toUpperCase().includes('出貨')||a.toUpperCase().includes('DATA')) return -1; if(b.toUpperCase().includes('出貨')||b.toUpperCase().includes('DATA')) return 1; return 0; }).forEach(n => { if(!found){ const txs = extractTransactions(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''})); if(txs&&txs.length>0) found=txs; } });
                if (found) initializeData(found); else showError('無法在 Excel 找到有效業績資料。');
            } catch(e) { showError('Excel 解析失敗：' + e.message); }
            btnText.textContent = '載入出貨明細';
        };
        reader.readAsArrayBuffer(file);
    } else { showError('請上傳 CSV 或 Excel。'); btnText.textContent = '載入出貨明細'; }
});

class MultiSelect {
    constructor(cId, label, ph, type, icon=null, ema=true) {
        this.container=document.getElementById(cId); this.label=label; this.placeholder=ph; this.type=type;
        this.iconSvg=icon||`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 flex-shrink-0"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
        this.emptyMeansAll=ema; this.options=[]; this.selected=[]; this.isOpen=false; this.searchTerm=''; this.render();
    }
    setOptions(opts, isInit=false) {
        const wasAll = this.options.length>0 && this.selected.length===this.options.length;
        this.options=opts;
        if(isInit||wasAll) { this.selected=[...opts]; }
        else { this.selected=this.selected.filter(s=>opts.includes(s)); if(this.selected.length===0&&opts.length>0) this.selected=[...opts]; }
        filters[this.type]=this.selected; this.updateDisplay(); if(this.isOpen) this.renderDropdownOptions();
    }
    toggle() { this.isOpen=!this.isOpen; if(!this.isOpen) this.searchTerm=''; this.renderDropdown(); }
    close() { if(this.isOpen){this.isOpen=false;this.searchTerm='';this.renderDropdown();} }
    toggleOption(opt,el) {
        if(this.selected.includes(opt)) this.selected=this.selected.filter(i=>i!==opt); else this.selected.push(opt);
        if(this.type==='months') this.selected.sort((a,b)=>parseInt(a)-parseInt(b));
        filters[this.type]=this.selected; this.updateDisplay();
        const isChk=this.selected.includes(opt); const box=el.querySelector('.checkbox-box');
        if(isChk){box.classList.remove('border-slate-300');box.classList.add('bg-blue-600','border-blue-600');box.innerHTML=ICON_CHECK;}
        else{box.classList.add('border-slate-300');box.classList.remove('bg-blue-600','border-blue-600');box.innerHTML='';}
        selectedHospital=null; updateFiltersUI(this.type); calculateAndRender();
    }
    selectAll(s) { this.selected=s?[...this.options]:[]; filters[this.type]=this.selected; this.updateDisplay(); this.renderDropdownOptions(); selectedHospital=null; updateFiltersUI(this.type); calculateAndRender(); }
    updateDisplay() {
        const t=this.container.querySelector('.ms-text'); if(!t) return;
        if(this.selected.length===this.options.length&&this.options.length>0) t.textContent=this.placeholder;
        else if(this.selected.length===0) t.textContent=this.emptyMeansAll?this.placeholder:'未選擇';
        else if(this.selected.length===1) t.textContent=this.selected[0];
        else if(this.type==='months') t.textContent=this.selected.length<=4?this.selected.join(', '):`已選 ${this.selected.length} 個月`;
        else t.textContent=`已選 ${this.selected.length} 項`;
    }
    render() {
        const ls=this.type==='months'?'text-blue-600':'text-slate-600';
        const bs=this.type==='months'?'bg-blue-50 border-blue-200 text-blue-800':'bg-slate-50 border-slate-200 text-slate-700';
        this.container.innerHTML=`<label class="block text-sm font-medium ${ls} mb-1 flex items-center gap-1">${this.type==='months'?'<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>':''} ${this.label}</label><div class="relative ms-wrapper"><div class="w-full border rounded-lg p-2 cursor-pointer flex justify-between items-center min-h-[42px] ms-btn ${bs}"><span class="text-sm flex-1 truncate pr-2 ms-text font-medium">${this.placeholder}</span>${this.iconSvg}</div><div class="ms-dropdown-container"></div></div>`;
        this.container.querySelector('.ms-btn').addEventListener('click',(e)=>{e.stopPropagation();this.toggle();});
    }
    renderDropdown() {
        const dc=this.container.querySelector('.ms-dropdown-container');
        if(!this.isOpen){dc.innerHTML='';return;}
        dc.innerHTML=`<div class="fixed inset-0 z-40 ms-overlay"></div><div class="absolute z-50 mt-1 w-full bg-white border border-slate-200 rounded-lg shadow-xl flex flex-col max-h-[350px] overflow-hidden"><div class="p-2 border-b border-slate-100 bg-slate-50 flex flex-col gap-2">${this.type!=='months'?`<div class="relative"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-2.5 top-2.5 text-slate-400"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><input type="text" class="w-full pl-8 pr-2 py-1.5 text-sm border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 ms-search" placeholder="搜尋..." value="${this.searchTerm}"></div>`:''}<div class="flex justify-between px-1 ${this.type==='months'?'mt-1':''}"><button class="text-xs text-blue-600 hover:text-blue-800 font-medium select-all-btn">全選</button><button class="text-xs text-slate-500 hover:text-slate-700 font-medium deselect-all-btn">取消全選</button></div></div><div class="overflow-y-auto flex-1 p-1 ms-options-list"></div></div>`;
        this.renderDropdownOptions();
        dc.querySelector('.ms-overlay').addEventListener('click',(e)=>{e.stopPropagation();this.close();});
        if(this.type!=='months'){const si=dc.querySelector('.ms-search');si.addEventListener('click',e=>e.stopPropagation());si.addEventListener('input',(e)=>{this.searchTerm=e.target.value;this.renderDropdownOptions();});}
        dc.querySelector('.select-all-btn').addEventListener('click',(e)=>{e.stopPropagation();this.selectAll(true);});
        dc.querySelector('.deselect-all-btn').addEventListener('click',(e)=>{e.stopPropagation();this.selectAll(false);});
    }
    renderDropdownOptions() {
        const lc=this.container.querySelector('.ms-options-list'); if(!lc) return;
        const filtered=this.options.filter(o=>o.toLowerCase().includes(this.searchTerm.toLowerCase()));
        if(filtered.length===0){lc.innerHTML=`<div class="px-3 py-4 text-sm text-center text-slate-400">找不到符合的選項</div>`;return;}
        lc.innerHTML=filtered.map(opt=>{const isChk=this.selected.includes(opt);return`<div class="flex items-center px-3 py-2 hover:bg-slate-100 cursor-pointer rounded transition-colors ms-opt" data-val="${opt}"><div class="checkbox-box w-4 h-4 mr-3 border rounded flex flex-shrink-0 items-center justify-center transition-colors ${isChk?'bg-blue-600 border-blue-600':'border-slate-300'}">${isChk?ICON_CHECK:''}</div><span class="text-sm text-slate-700">${opt}</span></div>`;}).join('');
        lc.querySelectorAll('.ms-opt').forEach(el=>{el.addEventListener('click',(e)=>{e.stopPropagation();this.toggleOption(el.getAttribute('data-val'),el);});});
    }
}

const monthMultiSelect = new MultiSelect('month-multiselect','比較基準 (2026年月份複選)','全部月份 (全年均)','months',null,false);
monthMultiSelect.options=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
monthMultiSelect.selected=filters.months; monthMultiSelect.updateDisplay();
const hospMultiSelect = new MultiSelect('hospital-multiselect','醫院 (可多選)','全部醫院','hospitals',null,true);
const catMultiSelect = new MultiSelect('category-multiselect','產品類別 (可多選)','全部類別','categories',null,true);
const prodMultiSelect = new MultiSelect('product-multiselect','單一產品 (智慧連動與搜尋)','全部產品','products',null,true);

document.getElementById('rep-filter').addEventListener('change',(e)=>{ filters.rep=e.target.value; selectedHospital=null; updateFiltersUI('rep'); calculateAndRender(); });

function updateFiltersUI(src='init') {
    const reps=new Set(),hospitals=new Set(),categories=new Set(),products=new Set();
    rawData.forEach(row=>{
        if(row.rep) reps.add(row.rep);
        const mr=!filters.rep||row.rep===filters.rep;
        if(mr){if(row.hospital) hospitals.add(row.hospital); if(row.category) categories.add(row.category);}
        const mh=filters.hospitals.length===0||filters.hospitals.includes(row.hospital);
        const mc=filters.categories.length===0||filters.categories.includes(row.category);
        if(mr&&mh&&mc){if(row.product) products.add(row.product);}
    });
    if(src==='init'){const rs=document.getElementById('rep-filter');rs.innerHTML='<option value="">全部業務</option>'+Array.from(reps).sort().map(r=>`<option value="${r}">${r}</option>`).join('');rs.value=filters.rep;}
    if(src==='init'||src==='rep'){hospMultiSelect.setOptions(Array.from(hospitals).sort(),src==='init');catMultiSelect.setOptions(Array.from(categories).sort(),src==='init');}
    prodMultiSelect.setOptions(Array.from(products).sort(),src==='init');
}

function calculateAndRender() {
    let fd=rawData;
    if(filters.rep) fd=fd.filter(r=>r.rep===filters.rep);
    if(filters.hospitals.length>0) fd=fd.filter(r=>filters.hospitals.includes(r.hospital));
    if(filters.categories.length>0) fd=fd.filter(r=>filters.categories.includes(r.category));
    if(filters.products.length>0) fd=fd.filter(r=>filters.products.includes(r.product));
    const hm={};
    fd.forEach(tx=>{
        const{hospital,rep,category,product,month,amount}=tx;
        if(!hm[hospital]) hm[hospital]={name:hospital,rep,products:{},months2025:Array(12).fill(0),months2026:Array(12).fill(0)};
        if(!hm[hospital].products[product]) hm[hospital].products[product]={name:product,category,months2025:Array(12).fill(0),months2026:Array(12).fill(0)};
        const yr=month.substring(0,4),mi=parseInt(month.substring(4,6),10)-1;
        if(yr==='2025'&&mi>=0&&mi<12){hm[hospital].months2025[mi]+=amount;hm[hospital].products[product].months2025[mi]+=amount;}
        else if(yr==='2026'&&mi>=0&&mi<12){hm[hospital].months2026[mi]+=amount;hm[hospital].products[product].months2026[mi]+=amount;}
    });
    const ds=g=>g>5?{label:'成長',icon:ICON_UP,color:'text-green-600'}:g<-5?{label:'衰退',icon:ICON_DOWN,color:'text-red-600'}:{label:'持平',icon:ICON_MINUS,color:'text-yellow-600'};
    const cm=(m25,m26)=>{
        const a25=m25.reduce((a,b)=>a+b,0)/12;
        let ts=0; const td=filters.months.length||1;
        if(filters.months.length>0) filters.months.forEach(ms=>{ts+=m26[parseInt(ms.replace('月',''))-1];});
        const at=filters.months.length>0?(ts/td):0;
        let tl=filters.months.length===0?'未選月份':filters.months.length===12?'26年全年均':filters.months.length<=4?`26年(${filters.months.map(m=>m.replace('月','')).join(',')})月均`:`26年(${filters.months.length}個月)均`;
        let gr=a25===0&&at>0?100:a25>0?((at-a25)/a25)*100:0;
        return{avg2025:Math.round(a25),avgTarget:Math.round(at),targetLabel:tl,growthRate:parseFloat(gr.toFixed(1)),status:ds(gr),totalOverall:(a25*12)+ts};
    };
    processedData=Object.values(hm).map(h=>{const m=cm(h.months2025,h.months2026);const pd=Object.values(h.products).map(p=>({...p,...cm(p.months2025,p.months2026)})).sort((a,b)=>b.totalOverall-a.totalOverall);return{...h,...m,productDetails:pd};}).sort((a,b)=>b.totalOverall-a.totalOverall).slice(0,20);
    const ht=processedData.length>0?processedData[0].targetLabel:'26年月均';
    document.getElementById('th-top20-target').textContent=ht; document.getElementById('th-detail-target').textContent=ht;
    renderTop20Table(); renderRightPanel();
}

function renderTop20Table() {
    const tbody=document.getElementById('top20-tbody');
    if(processedData.length===0){tbody.innerHTML=`<tr><td colspan="4" class="text-center py-8 text-slate-500">查無符合條件的資料</td></tr>`;return;}
    tbody.innerHTML=processedData.map((h,i)=>{const isSel=selectedHospital&&selectedHospital.name===h.name;return`<tr class="border-b border-slate-50 cursor-pointer transition-colors top20-row ${isSel?'bg-blue-50 border-blue-200':'hover:bg-slate-50'}" data-index="${i}"><td class="px-4 py-3 font-medium text-slate-800"><span class="text-slate-400 mr-2">#${i+1}</span>${h.name}</td><td class="px-4 py-3 text-right text-slate-600">${formatMoney(h.avg2025)}</td><td class="px-4 py-3 text-right font-medium text-blue-700">${formatMoney(h.avgTarget)}</td><td class="px-4 py-3"><div class="flex items-center justify-center gap-1 font-semibold ${h.status.color}">${h.status.icon} ${h.growthRate}%</div></td></tr>`;}).join('');
    document.querySelectorAll('.top20-row').forEach(row=>{row.addEventListener('click',function(){selectedHospital=processedData[this.getAttribute('data-index')];renderTop20Table();renderRightPanel();});});
}

function renderRightPanel() {
    const es=document.getElementById('hospital-empty'),ds=document.getElementById('hospital-details');
    if(!selectedHospital){es.classList.remove('hidden-element');ds.classList.add('hidden-element');return;}
    es.classList.add('hidden-element'); ds.classList.remove('hidden-element');
    document.getElementById('detail-hosp-name').textContent=selectedHospital.name;
    document.getElementById('detail-hosp-rep').textContent=`業代碼：${selectedHospital.rep}`;
    const sel=document.getElementById('detail-hosp-status');
    sel.className=`px-4 py-2 rounded-full flex items-center gap-2 font-bold text-lg bg-slate-50 ${selectedHospital.status.color}`;
    sel.innerHTML=`${selectedHospital.status.label}: ${selectedHospital.growthRate}%`;
    document.getElementById('detail-products-tbody').innerHTML=selectedHospital.productDetails.map(p=>`<tr class="border-b border-slate-50 hover:bg-slate-50"><td class="px-4 py-3 text-slate-500">${p.category}</td><td class="px-4 py-3 font-medium text-slate-700">${p.name}</td><td class="px-4 py-3 text-right text-slate-600">${formatMoney(p.avg2025)}</td><td class="px-4 py-3 text-right font-medium text-blue-700">${formatMoney(p.avgTarget)}</td><td class="px-4 py-3"><div class="flex items-center justify-center gap-1 font-semibold ${p.status.color}">${p.status.icon} ${p.growthRate}%</div></td></tr>`).join('');
    renderCharts();
}

function calculateTrendLine(data,yKey) {
    let sx=0,sy=0,sxy=0,sxx=0,n=0;
    data.forEach((d,i)=>{const y=Number(d[yKey])||0;sx+=i;sy+=y;sxy+=i*y;sxx+=i*i;n++;});
    if(n===0) return data;
    const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx)||0;
    const intercept=(sy-slope*sx)/n;
    return data.map((d,i)=>({...d,[`${yKey}_trend`]:Math.max(0,slope*i+intercept)}));
}

function renderCharts() {
    let em=12;
    if(filters.months&&filters.months.length>0) em=Math.max(...filters.months.map(m=>parseInt(m.replace('月',''))));
    else if(parseInt(latestDataMonth.substring(0,4))===2026) em=parseInt(latestDataMonth.substring(4,6));
    const cl=[],dk=[];
    for(let m=1;m<=12;m++){cl.push(`25/${String(m).padStart(2,'0')}`);dk.push({year:2025,monthIdx:m-1});}
    for(let m=1;m<=em;m++){cl.push(`26/${String(m).padStart(2,'0')}`);dk.push({year:2026,monthIdx:m-1});}
    let data=cl.map((label,i)=>{const{year,monthIdx}=dk[i];const pt={month:label};pt.total=year===2025?selectedHospital.months2025[monthIdx]:selectedHospital.months2026[monthIdx];selectedHospital.productDetails.forEach(p=>{pt[p.name]=year===2025?p.months2025[monthIdx]:p.months2026[monthIdx];});return pt;});
    data=calculateTrendLine(data,'total');
    selectedHospital.productDetails.forEach(p=>{data=calculateTrendLine(data,p.name);});
    Chart.defaults.font.family="'Inter','Helvetica Neue',sans-serif"; Chart.defaults.color='#64748b';
    const co={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{tooltip:{callbacks:{label:(c)=>`${c.dataset.label}: ${formatMoney(c.raw)}`}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#e2e8f0',borderDash:[3,3]},ticks:{callback:(v)=>`${v/1000}k`}}}};
    if(totalChartInstance) totalChartInstance.destroy();
    totalChartInstance=new Chart(document.getElementById('totalChart'),{type:'line',data:{labels:cl,datasets:[{label:'實際金額',data:data.map(d=>d.total),borderColor:'#2563eb',backgroundColor:'#2563eb',tension:0.3,borderWidth:3,pointRadius:4,pointHoverRadius:6},{label:'線性趨勢線',data:data.map(d=>d.total_trend),borderColor:'#94a3b8',borderDash:[5,5],tension:0,borderWidth:2,pointRadius:0}]},options:co});
    const colors=['#f59e0b','#10b981','#ec4899','#8b5cf6','#06b6d4','#f43f5e','#f97316','#14b8a6','#6366f1'];
    const pds=[];
    selectedHospital.productDetails.forEach((p,i)=>{const c=colors[i%colors.length];pds.push({label:p.name,data:data.map(d=>d[p.name]),borderColor:c,backgroundColor:c,tension:0.3,borderWidth:2,pointRadius:3});pds.push({label:`${p.name} 趨勢`,data:data.map(d=>d[`${p.name}_trend`]),borderColor:c,borderDash:[3,3],tension:0,borderWidth:1,pointRadius:0,backgroundColor:'transparent'});});
    if(productChartInstance) productChartInstance.destroy();
    productChartInstance=new Chart(document.getElementById('productChart'),{type:'line',data:{labels:cl,datasets:pds},options:{...co,plugins:{...co.plugins,legend:{position:'top',labels:{boxWidth:12,usePointStyle:true,filter:(item)=>!item.text.includes('趨勢')}}}}});
}
</script>
